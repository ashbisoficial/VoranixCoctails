name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: List output
        run: ls -la build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: cocteleria-jar
          path: build/libs/cocteleria-*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cocteleria v1.0.${{ github.run_number }}
          make_latest: true
          files: build/libs/cocteleria-1.0.0.jar
